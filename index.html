    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: var(--light-color);
        text-align: center;
        padding: 20px;
      }
      .message-container {
        max-width: 600px;
        width: 100%;
      }
      h1 {
        margin-bottom: 20px;
      }
      p {
        font-size: clamp(1rem, 3vw, 1.2rem);
        color: #555;
        margin-bottom: 30px;
      }
      .social-links {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 40px;
      }
      .social-links a {
        color: var(--dark-color);
        font-size: 2rem;
        transition: transform 0.3s ease, color 0.3s ease;
      }
      .social-links a:hover {
        color: var(--primary-color);
        transform: translateY(-5px);
      }
      .footer-minimal {
        margin-top: 50px;
        font-size: 0.9rem;
        color: #888;
      }
    </style>
